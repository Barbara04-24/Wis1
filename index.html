<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIORA — Video</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #0b0b0b;
  color: #f5f2ed;
  min-height: 100vh;
}

/* HEADER */

header {
  padding: 22px 6%;
  border-bottom: 1px solid rgba(216,193,154,.18);
}

.logo {
  color: #d8c19a;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 5px;
}

/* CONTAINER */

.container {
  width: min(1100px,92%);
  margin: auto;
  padding: 45px 0 70px;
}

/* TITLE */

.video-heading {
  text-align: center;
  margin-bottom: 28px;
}

.video-heading h1 {
  font-size: clamp(26px,5vw,46px);
  font-weight: 500;
  line-height: 1.2;
  margin-bottom: 12px;
}

.video-heading p {
  color: #aaa39a;
  font-size: 14px;
}

/* PLAYER */

.player-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border: 1px solid rgba(216,193,154,.25);
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
}

video {
  width: 100%;
  height: 100%;
  display: block;
  background: #000;
}

/* PLAYER OVERLAY */

.play-overlay {
  position: absolute;
  inset: 0;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  text-align: center;
  padding: 25px;

  background: rgba(0,0,0,.88);

  z-index: 5;
}

.play-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

.overlay-title {
  color: #d8c19a;
  font-size: 18px;
  margin-bottom: 10px;
}

.overlay-text {
  color: #aaa39a;
  font-size: 13px;
  line-height: 1.7;
  max-width: 500px;
  margin-bottom: 20px;
}

/* BUTTONS */

.btn {
  border: 1px solid #d8c19a;
  background: transparent;
  color: #d8c19a;

  padding: 13px 25px;

  font-size: 12px;
  letter-spacing: 1.5px;
  text-transform: uppercase;

  cursor: pointer;
  text-decoration: none;

  transition: .25s ease;
}

.btn:hover {
  background: #d8c19a;
  color: #111;
}

.btn-play {
  display: none;
}

.btn-play.active {
  display: inline-block;
}

/* SPONSOR */

.sponsor-note {
  text-align: center;
  padding: 22px 10px;
  color: #777168;
  font-size: 12px;
  line-height: 1.6;
}

.sponsor-note strong {
  color: #d8c19a;
}

/* LIST */

.section-title {
  margin: 35px 0 18px;

  color: #d8c19a;

  font-size: 13px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.video-list {
  border-top: 1px solid rgba(255,255,255,.08);
}

.video-item {
  display: flex;
  align-items: center;
  gap: 18px;

  padding: 20px 10px;

  border-bottom: 1px solid rgba(255,255,255,.08);

  cursor: pointer;

  transition: .25s ease;
}

.video-item:hover {
  background: rgba(216,193,154,.05);
  padding-left: 18px;
}

.video-item.active {
  background: rgba(216,193,154,.07);
}

.number {
  width: 35px;
  color: #777168;
  font-size: 13px;
}

.item-info {
  flex: 1;
}

.item-title {
  font-size: 16px;
  margin-bottom: 5px;
}

.item-description {
  color: #817c75;
  font-size: 12px;
}

.arrow {
  color: #d8c19a;
  font-size: 20px;
}

/* FOOTER */

footer {
  text-align: center;
  padding: 30px 20px;

  border-top: 1px solid rgba(255,255,255,.07);

  color: #66615b;
  font-size: 12px;
}

/* MOBILE */

@media(max-width:600px){

  header {
    padding: 18px 5%;
  }

  .logo {
    font-size: 18px;
    letter-spacing: 4px;
  }

  .container {
    width: 94%;
    padding-top: 30px;
  }

  .video-heading h1 {
    font-size: 27px;
  }

  .video-heading p {
    font-size: 12px;
  }

  .overlay-title {
    font-size: 16px;
  }

  .overlay-text {
    font-size: 12px;
  }

  .btn {
    width: 100%;
    max-width: 280px;
  }

  .video-item {
    gap: 12px;
    padding: 17px 5px;
  }

  .item-title {
    font-size: 14px;
  }

  .item-description {
    font-size: 11px;
  }

  .number {
    width: 25px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">VIORA</div>
</header>


<main class="container">

  <!-- TITLE -->

  <div class="video-heading">

    <h1 id="mainTitle">
      Pilih Video
    </h1>

    <p id="mainDescription">
      Pilih video dari daftar di bawah.
    </p>

  </div>


  <!-- PLAYER -->

  <div class="player-wrapper">

    <video
      id="videoPlayer"
      controls
      preload="metadata">

      Browser Anda tidak mendukung video HTML5.

    </video>


    <!-- OVERLAY -->

    <div
      id="playOverlay"
      class="play-overlay">

      <div
        id="overlayTitle"
        class="overlay-title">

        Pilih Video

      </div>


      <div
        id="overlayText"
        class="overlay-text">

        Silakan pilih video terlebih dahulu
        dari daftar di bawah.

      </div>


      <!-- SPONSOR BUTTON -->

      <a
        id="sponsorButton"
        class="btn"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        style="display:none;">

        Lanjut ke Sponsor

      </a>


      <!-- PLAY BUTTON -->

      <button
        id="playButton"
        class="btn btn-play">

        ▶ &nbsp; Putar Video

      </button>

    </div>

  </div>


  <!-- NOTICE -->

  <div class="sponsor-note">

    <strong>Dukungan untuk VIORA</strong><br>

    Anda dapat membuka halaman sponsor
    sebelum menikmati video.

  </div>


  <!-- LIST -->

  <div class="section-title">

    Daftar Video

  </div>


  <div
    id="videoList"
    class="video-list">

  </div>

</main>


<footer>

  © 2026 VIORA — All Rights Reserved

</footer>


<script>

/*
==================================================
DATABASE VIDEO
==================================================

Tambahkan video baru dengan format:

{
  title: "Judul Video",
  description: "Deskripsi video",
  video: "URL VIDEO",
  sponsor: "SMARTLINK"
}

Bisa 10, 20, 100 atau lebih.
==================================================
*/


const videos = [

  {
    title: "Judul Video 01",
    description: "Video pilihan pertama.",
    video: "https://h0tvidey.github.io/EGA10/",
    sponsor: "SMARTLINK_PROFITON_01"
  },

  {
    title: "Judul Video 02",
    description: "Video pilihan kedua.",
    video: "https://h0tvidey.github.io/EGA9/",
    sponsor: "SMARTLINK_PROFITON_02"
  },

  {
    title: "Judul Video 03",
    description: "Video pilihan ketiga.",
    video: "https://h0tvidey.github.io/EGA8/",
    sponsor: "SMARTLINK_PROFITON_03"
  },

  {
    title: "Judul Video 04",
    description: "Video pilihan keempat.",
    video: "https://h0tvidey.github.io/EGA7/",
    sponsor: "SMARTLINK_PROFITON_04"
  },

  {
    title: "Judul Video 05",
    description: "Video pilihan kelima.",
    video: "https://h0tvidey.github.io/EGA6/",
    sponsor: "SMARTLINK_PROFITON_05"
  },

  {
    title: "Judul Video 06",
    description: "Video pilihan keenam.",
    video: "https://h0tvidey.github.io/EGA5/",
    sponsor: "SMARTLINK_PROFITON_06"
  },

  {
    title: "Judul Video 07",
    description: "Video pilihan ketujuh.",
    video: "https://h0tvidey.github.io/EGA4/",
    sponsor: "SMARTLINK_PROFITON_07"
  },

  {
    title: "Judul Video 08",
    description: "Video pilihan kedelapan.",
    video: "https://h0tvidey.github.io/EGA3/",
    sponsor: "SMARTLINK_PROFITON_08"
  },

  {
    title: "Judul Video 09",
    description: "Video pilihan kesembilan.",
    video: "https://h0tvidey.github.io/EGA1/",
    sponsor: "SMARTLINK_PROFITON_09"
  },

  {
    title: "Judul Video 10",
    description: "Video pilihan kesepuluh.",
    video: "https://h0tvidey.github.io/EGA2/",
    sponsor: "SMARTLINK_PROFITON_10"
  }

];


/*
==================================================
ELEMENT
==================================================
*/

const list =
  document.getElementById("videoList");

const video =
  document.getElementById("videoPlayer");

const overlay =
  document.getElementById("playOverlay");

const overlayTitle =
  document.getElementById("overlayTitle");

const overlayText =
  document.getElementById("overlayText");

const sponsorButton =
  document.getElementById("sponsorButton");

const playButton =
  document.getElementById("playButton");

const mainTitle =
  document.getElementById("mainTitle");

const mainDescription =
  document.getElementById("mainDescription");


let selectedVideo = null;

let sponsorOpened = false;


/*
==================================================
MEMBUAT DAFTAR VIDEO OTOMATIS
==================================================
*/

videos.forEach((item,index) => {

  const element =
    document.createElement("div");

  element.className =
    "video-item";


  element.innerHTML = `

    <div class="number">
      ${String(index + 1).padStart(2,"0")}
    </div>

    <div class="item-info">

      <div class="item-title">
        ${item.title}
      </div>

      <div class="item-description">
        ${item.description}
      </div>

    </div>

    <div class="arrow">
      ›
    </div>

  `;


  element.addEventListener(
    "click",
    () => {

      selectVideo(
        index,
        element
      );

    }
  );


  list.appendChild(element);

});


/*
==================================================
PILIH VIDEO
==================================================
*/

function selectVideo(index,element){

  selectedVideo =
    videos[index];


  /*
   * Reset proses sponsor
   * setiap memilih video baru.
   */

  sponsorOpened =
    false;


  /*
   * Update judul
   */

  mainTitle.textContent =
    selectedVideo.title;

  mainDescription.textContent =
    selectedVideo.description;


  /*
   * Load video
   */

  video.pause();

  video.src =
    selectedVideo.video;

  video.load();


  /*
   * Reset overlay
   */

  overlay.classList.remove(
    "hidden"
  );


  overlayTitle.textContent =
    "Dukungan untuk VIORA";


  overlayText.textContent =
    "Jika Anda ingin mendukung website ini, " +
    "silakan membuka halaman sponsor terlebih dahulu. " +
    "Setelah selesai, kembali ke halaman ini " +
    "dan pilih Putar Video.";


  /*
   * Tampilkan sponsor
   */

  sponsorButton.style.display =
    "inline-flex";

  sponsorButton.href =
    selectedVideo.sponsor;


  /*
   * Sembunyikan Play
   */

  playButton.classList.remove(
    "active"
  );


  /*
   * Tandai video aktif
   */

  document
    .querySelectorAll(".video-item")
    .forEach(item => {

      item.classList.remove(
        "active"
      );

    });


  element.classList.add(
    "active"
  );


  /*
   * Scroll ke player
   */

  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}


/*
==================================================
KETIKA USER MEMBUKA SPONSOR
==================================================
*/

sponsorButton.addEventListener(
  "click",
  function(){

    /*
     * Hanya mencatat bahwa tombol
     * sponsor telah diklik.
     */

    sponsorOpened =
      true;


    /*
     * Setelah user kembali ke website,
     * tombol Play dapat digunakan.
     */

    setTimeout(() => {

      overlayTitle.textContent =
        "Terima Kasih";


      overlayText.textContent =
        "Anda dapat kembali ke halaman ini " +
        "dan memutar video pilihan Anda.";


      sponsorButton.style.display =
        "none";


      playButton.classList.add(
        "active"
      );

    },100);

  }
);


/*
==================================================
PLAY VIDEO
==================================================
*/

playButton.addEventListener(
  "click",
  function(){

    if(!selectedVideo){

      return;

    }


    /*
     * Video hanya diputar
     * setelah proses sponsor.
     */

    if(!sponsorOpened){

      return;

    }


    video.play();


    overlay.classList.add(
      "hidden"
    );

  }
);


/*
==================================================
KETIKA VIDEO DI-PAUSE
==================================================
*/

video.addEventListener(
  "pause",
  function(){

    if(
      !video.ended &&
      selectedVideo &&
      sponsorOpened
    ){

      overlay.classList.remove(
        "hidden"
      );

      overlayTitle.textContent =
        selectedVideo.title;

      overlayText.textContent =
        "Tekan tombol di bawah untuk melanjutkan video.";

      sponsorButton.style.display =
        "none";

      playButton.classList.add(
        "active"
      );

    }

  }
);

</script>

</body>
</html>
